# C1 (fork-internal test of the commenter's trust in the check's artifact): this pull request replaces the check.
name: SANTA
on:
  pull_request:
permissions:
  contents: read
jobs:
  santa:
    runs-on: ubuntu-latest
    steps:
      - name: write the comment and pr.json the commenter reads
        env:
          PR: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          out="$GITHUB_WORKSPACE/.santa-pr/artifact"; mkdir -p "$out"
          printf '## C1 test\n\nThis text was written by this pull request'"'"'s own santa.yml, not by the SANTA runner.\n' > "$out/comment.md"
          printf '{"number":"%s","head":"%s"}\n' "$PR" "$PR_HEAD" > "$out/pr.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: santa-pr
          path: .santa-pr/artifact/
          retention-days: 1
